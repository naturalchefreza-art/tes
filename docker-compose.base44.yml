services:
  web:
    image: node:22
    working_dir: /app
    command:
      [
        "sh",
        "-ec",
        "npm install --no-audit --no-fund && exec npm run dev -- --host 0.0.0.0 --port 3000 --strictPort",
      ]
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    ports:
      - "3000:3000"
    environment:
      # Platform sets this; Vite >= 6.1 appends it to allowedHosts. Harmless on Vite 5.
      - __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS
      # Bind mounts often need polling for hot reload to fire.
      - CHOKIDAR_USEPOLLING=true
    healthcheck:
      test:
        [
          "CMD",
          "sh",
          "-ec",
          "node -e \"fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\"",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 90s
    restart: on-failure

volumes:
  node_modules:
